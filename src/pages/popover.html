<!DOCTYPE html>
<html lang="en">
<head>
    <title>popover</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="py-10">
    <div class="container  xl:w-7/12">
      <h2 class="mb-8">popover component</h2>
        <ul class="space-y-6 xl:w-7/12">
          <li>
            <h3 class="text-h5 lg:text-h4 text-aeblack-500 leading-normal pt-4 mb-4 lg:mb-6"></h3>
            @@include('./components/popover/popover.html', {
              "popoverId": "my-unique-popover",
              "buttonText": "Click Me",
              "popoverTitle": "Information",
              "popoverContent": "This is some helpful information in the popover.",
            })
          </li>
          <li>
           <button data-popover-target="popover-default" type="button" class="aegov-btn">--Button text--</button>
<div data-popover id="popover-default" role="tooltip" class="aegov-popover w-64">
	<div class="popover-header bg-aeblack-50 px-3 py-2">
		<div class="font-semibold text-aeblack-900">--Popover title--</div>
	</div>
	<div class="popover-body px-3 py-2 text-aeblack-600">
		<p class="mb-0">--Description--</p>
	</div>
	<div data-popper-arrow></div>
</div>
        </li>
      </ul>
    </div>
<script src="./js/script.js"></script>    
<script src="./js/aegov-scripts.js"></script>  
</body>
</html>
